apiVersion: v1
kind: Pod
metadata:
  labels:
    run: mysql-po
  name: mysql-po
spec:
  containers:
  - image: mysql
    name: mysql-po
    ports:
    - containerPort: 3306

    # we will mount secret like this
    env:
    - name: MYSQL_USER
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: MYSQL_USER
    
    - name: MYSQL_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          key: MYSQL_ROOT_PASSWORD
          name: db-secret
  dnsPolicy: ClusterFirst
  restartPolicy: Always
