apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: busybox-pvc
  name: busybox-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-pvc
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: busybox-pvc
    spec:
      containers:
      - image: busybox
        name: busybox
        command: ["sh", "-c", "echo 'Hello from busybox' > /mnt/logs/PCVExampleFile.txt; sleep 3600"]
        volumeMounts:
          - mountPath: /mnt/logs
            name: new-logs-volume
      volumes:
        - name: new-logs-volume
          persistentVolumeClaim:
            claimName: busybox-pvc

# /mnt/logs        (inside container)
#         ↓
# PVC
#         ↓
# PV
#         ↓
# /mnt/pvc/logs    (on node filesystem)